# Example Nginx server block for garderob.men on a Ubuntu VPS.
# Copy to /etc/nginx/sites-available/garderob.men, adjust paths/domain, then:
#   sudo ln -s /etc/nginx/sites-available/garderob.men /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes:
#   - the built frontend lives at /var/www/garderob-men/dist (output of `npm run build` at repo root)
#   - the backend (PM2, see ecosystem.config.cjs) listens on 127.0.0.1:4000
#   - certbot has already issued a certificate for the domain (see DEPLOY.md)

server {
    listen 80;
    listen [::]:80;
    server_name garderob.men www.garderob.men;

    # Uncomment once certbot has run once over plain HTTP to issue the cert,
    # then certbot --nginx will rewrite this block to redirect to HTTPS automatically.
    # return 301 https://$host$request_uri;

    root /var/www/garderob-men/dist;
    index index.html;

    client_max_body_size 10m;

    # Uploaded product images, served directly from disk by the backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API — same-origin from the frontend's point of view, so no CORS
    # headers are needed between Nginx and the browser (only the backend's
    # own CORS_ORIGIN check applies, as a defense-in-depth belt-and-braces).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (BrowserRouter) — any path not matched above falls back
    # to index.html so client-side routing (/admin, /order/:id, /offer, ...)
    # works on a hard refresh or direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets; index.html itself is not
    # matched by this and is always revalidated.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
